name: digital-assets-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assets
      POSTGRES_DB: assets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assets -d assets"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  migrate:
    image: digital-assets-backend:${IMAGE_VERSION:?IMAGE_VERSION is required}
    entrypoint: ["/app/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    image: digital-assets-backend:${IMAGE_VERSION:?IMAGE_VERSION is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      UPLOAD_DIR: /data/uploads
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?ALLOWED_ORIGIN is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      TZ: Asia/Shanghai
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8888/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internal

  frontend:
    image: digital-assets-frontend:${IMAGE_VERSION:?IMAGE_VERSION is required}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-9009}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  uploads-data:
